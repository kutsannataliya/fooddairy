<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Дневник питания</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ln:#e3e1da;--ac:#2f7d6b;--acbg:#dff0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--tx:#efeeea;--mut:#a3a29c;--ln:#363633;--ac:#5fc2a8;--acbg:#1f3a33}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 2px}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
button,input,textarea{font:inherit;color:var(--tx)}
.nav button,.btn,input[type=date],input[type=time]{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px}
.btn{font-size:14px;border-color:var(--ac);background:var(--acbg)}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.meal{border-left:5px solid var(--ln)}.meal.done{border-left-color:var(--ac);background:var(--acbg)}
.meal b{font-size:17px}
.tm{display:flex;gap:6px;align-items:center}
textarea{width:100%;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px;margin-top:8px;resize:vertical}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:6px 0}
.row b{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:13px;padding:8px}.tabs button.on{color:var(--ac);font-weight:700}
.start{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sv{font-size:12px;color:var(--mut);min-height:16px;text-align:right}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tabs" id="tabs"></div>
<script>
const M=[["b","Завтрак"],["b2","Второй завтрак"],["s","Перекус"],["l","Обед"],["a","Полдник"],["d","Ужин"]];
const DAY=864e5;
let mem={};
const ld=k=>{try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const isoMs=ms=>new Date(ms).toISOString().slice(0,10);
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)};
const t0=new Date(),today=t0.getFullYear()+"-"+pad(t0.getMonth()+1)+"-"+pad(t0.getDate());
const longD=dt=>new Date(parse(dt)).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur=today,tab="d",tmr=null;
function getDay(dt){try{return JSON.parse(ld("d|"+dt)||"{}")||{}}catch(e){return{}}}
const filled=e=>!!(e&&((e.t&&e.t.length)||(e.x&&e.x.trim())));
const cnt=dd=>M.filter(([k])=>filled(dd[k])).length;
function stat(){
 const dd=getDay(cur),n=cnt(dd);
 M.forEach(([k])=>{const c=document.getElementById("m_"+k);if(c)c.classList.toggle("done",filled(dd[k]))});
 const p=document.getElementById("pg");if(p)p.textContent="Заполнено "+n+" из "+M.length;
 const b=document.getElementById("pb");if(b)b.style.width=(n/M.length*100)+"%";
}
function upd(k,f,v){
 const dd=getDay(cur);dd[k]=dd[k]||{};dd[k][f]=v;
 if(!filled(dd[k]))delete dd[k];
 sv("d|"+cur,Object.keys(dd).length?JSON.stringify(dd):"");
 stat();const s=document.getElementById("sv");if(s){s.textContent="Сохранено";clearTimeout(tmr);tmr=setTimeout(()=>{s.textContent=""},1500)}
}
function now(k){const d=new Date(),v=pad(d.getHours())+":"+pad(d.getMinutes());
 const i=document.querySelector("#m_"+k+" input[type=time]");if(i)i.value=v;upd(k,"t",v)}
function go(n){cur=isoMs(parse(cur)+n*DAY);render()}
function setDate(v){if(v){cur=v;render()}}
function openDay(dt){cur=dt;tab="d";render();scrollTo(0,0)}
function dayView(){
 const dd=getDay(cur),n=cnt(dd);
 let h=`<h1>${cur===today?"Сегодня":"День"}</h1><div class="mut">${longD(cur)}</div>
 <div class="card"><div class="nav"><button onclick="go(-1)">←</button><input type="date" value="${cur}" onchange="setDate(this.value)"><button onclick="go(1)">→</button></div>
 <div class="nav" style="margin-top:8px"><b id="pg">Заполнено ${n} из ${M.length}</b><span class="sv" id="sv"></span></div><div class="bar"><i id="pb" style="width:${n/M.length*100}%"></i></div></div>`;
 M.forEach(([k,lb])=>{const e=dd[k]||{};
  h+=`<div class="card meal ${filled(e)?"done":""}" id="m_${k}"><div class="nav"><b>${lb}</b><span class="tm"><input type="time" value="${e.t||""}" oninput="upd('${k}','t',this.value)" onchange="upd('${k}','t',this.value)"><button class="btn" onclick="now('${k}')">сейчас</button></span></div>
  <textarea rows="3" placeholder="Что и сколько ели и пили" oninput="upd('${k}','x',this.value)">${esc(e.x||"")}</textarea></div>`});
 return h}
function dayKeys(){const o=[];
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("d|")&&localStorage.getItem(k))o.push(k.slice(2))}}
 catch(e){for(const k in mem)if(k.startsWith("d|")&&mem[k])o.push(k.slice(2))}
 return [...new Set(o)].sort().reverse()}
function hist(){
 const ds=dayKeys();let h=`<h1>История</h1><div class="mut">Дни с записями. Нажмите, чтобы открыть.</div>`;
 if(!ds.length)return h+`<div class="card">Записей пока нет.</div>`;
 ds.forEach(dt=>{const dd=getDay(dt),f=M.find(([k])=>dd[k]&&dd[k].x&&dd[k].x.trim());
  const pr=f?esc(dd[f[0]].x.trim().slice(0,60)):"";
  h+=`<button class="row" onclick="openDay('${dt}')"><b>${longD(dt)}</b><span class="mut">Заполнено ${cnt(dd)} из ${M.length}${pr?" · "+pr:""}</span></button>`});
 return h}
const KEY=/^d\|/;
function snap(){const o={};
 const add=(k,v)=>{if(k&&KEY.test(k)&&v)o[k]=v};
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);add(k,localStorage.getItem(k))}}catch(e){for(const k in mem)add(k,mem[k])}
 return JSON.stringify({v:1,app:"food",t:Date.now(),data:o})}
function msg(t){const m=document.getElementById("bm");if(m)m.textContent=t}
function copyBk(){const t=snap(),ta=document.getElementById("bkta");sv("bk",String(Date.now()));
 const fb=()=>{ta.value=t;ta.focus();ta.select();msg("Не удалось скопировать автоматически. Текст выделен, скопируйте его вручную.")};
 try{navigator.clipboard.writeText(t).then(()=>msg("Скопировано. Вставьте текст в заметки или отправьте себе."),fb)}catch(e){fb()}}
function dl(){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([snap()],{type:"application/json"}));a.download="food-diary-backup.json";document.body.appendChild(a);a.click();a.remove();sv("bk",String(Date.now()));msg("Файл сохранён, если браузер разрешил загрузку.")}catch(e){msg("Загрузка файла здесь недоступна, используйте копирование текста.")}}
function restore(){try{const o=JSON.parse(document.getElementById("rs").value);
 if(!o||typeof o.data!=="object")throw 0;let n=0;
 for(const k in o.data)if(KEY.test(k)){sv(k,String(o.data[k]));n++}
 render();msg("Восстановлено дней: "+n)}catch(e){msg("Текст копии не распознан. Проверьте, что вставлен весь текст.")}}
function readFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById("rs").value=r.result;msg("Файл прочитан. Нажмите «Восстановить».")};r.readAsText(f)}
function copyView(){const bk=ld("bk");
 return `<h1>Копия</h1><div class="card"><b>Резервная копия</b>
 <div class="mut" style="margin:4px 0 8px">Записи хранятся в этом браузере. Браузер может удалить их при очистке данных. Сохраните копию и восстановите её при необходимости.${bk?" Последняя копия: "+new Date(+bk).toLocaleDateString("ru-RU")+".":" Копия ещё не делалась."}</div>
 <div class="start"><button class="btn" onclick="copyBk()">Скопировать копию</button><button class="btn" onclick="dl()">Скачать файл</button></div>
 <textarea id="bkta" rows="2" readonly></textarea>
 <b>Восстановить</b><textarea id="rs" rows="2" placeholder="Вставьте текст копии"></textarea>
 <div class="start"><button class="btn" onclick="restore()">Восстановить</button><input type="file" accept=".json,application/json" onchange="readFile(this)"></div>
 <p class="mut" id="bm"></p></div>`}
function render(){
 document.getElementById("app").innerHTML={d:dayView,h:hist,c:copyView}[tab]();
 const b=document.getElementById("bkta");if(b)b.value=snap();
 document.getElementById("tabs").innerHTML=[["d","День"],["h","История"],["c","Копия"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render();scrollTo(0,0)">${l}</button>`).join("");
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
</script>
</body>
</html>
